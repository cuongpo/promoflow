<svg xmlns="http://www.w3.org/2000/svg" font-family="Inter, Helvetica, Arial, sans-serif" viewBox="0 0 760 290" role="img" aria-label="Gemini goes live for submission; the rest lands before Demo Day" font-size="13"><text x="24" y="32" font-size="15" font-weight="600" fill="#1a1d21">Gemini goes live for submission; the rest lands before Demo Day</text><g><rect x="24" y="60" width="169" height="116" rx="8" fill="#2a6fdb" fill-opacity="0.12" stroke="#2a6fdb" stroke-width="2"></rect><text x="36" y="84" font-weight="600" fill="#1a1d21">Gemini live</text><text x="36" y="102" font-size="11.5" fill="#1a1d21">Oct 13–18</text><text x="36" y="126" font-size="11.5" fill="#5f6670">Format + workflow plan</text><text x="36" y="142" font-size="11.5" fill="#5f6670">Script and demo cuts</text><text x="36" y="158" font-size="11.5" fill="#5f6670">Deploy, demo video</text></g><g><rect x="205" y="60" width="169" height="116" rx="8" fill="none" fill-opacity="1" stroke="#9aa0a6" stroke-width="1.25"></rect><text x="217" y="84" font-weight="600" fill="#1a1d21">Accounts + render</text><text x="217" y="102" font-size="11.5" fill="#1a1d21">Oct 19–Nov 8</text><text x="217" y="126" font-size="11.5" fill="#5f6670">Sign-in, storage</text><text x="217" y="142" font-size="11.5" fill="#5f6670">Job queue, workers</text><text x="217" y="158" font-size="11.5" fill="#5f6670">Server MP4, voiceover</text></g><g><rect x="386" y="60" width="169" height="116" rx="8" fill="none" fill-opacity="1" stroke="#9aa0a6" stroke-width="1.25"></rect><text x="398" y="84" font-weight="600" fill="#1a1d21">Ship to YouTube</text><text x="398" y="102" font-size="11.5" fill="#1a1d21">Nov 9–29</text><text x="398" y="126" font-size="11.5" fill="#5f6670">Veo hooks, upload</text><text x="398" y="142" font-size="11.5" fill="#5f6670">30-Short eval set</text><text x="398" y="158" font-size="11.5" fill="#5f6670">First pilot founders</text></g><g><rect x="567" y="60" width="169" height="116" rx="8" fill="none" fill-opacity="1" stroke="#9